<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#111826"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66FCF1"/>
      <stop offset="1" stop-color="#45A29E"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66FCF1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#66FCF1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg4)"/>
  <circle cx="600" cy="120" r="150" fill="#66FCF1" opacity="0.10"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <line x1="60" y1="120" x2="740" y2="120"/>
    <line x1="60" y1="200" x2="740" y2="200"/>
    <line x1="60" y1="280" x2="740" y2="280"/>
  </g>
  <!-- area trend -->
  <path d="M60 300 L160 250 L260 270 L360 200 L460 220 L560 150 L660 170 L740 110 L740 340 L60 340 Z" fill="url(#fill)"/>
  <polyline points="60,300 160,250 260,270 360,200 460,220 560,150 660,170 740,110" fill="none" stroke="#66FCF1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- candlesticks -->
  <g stroke-width="3">
    <g stroke="#66FCF1" fill="#66FCF1">
      <line x1="150" y1="230" x2="150" y2="300"/><rect x="142" y="248" width="16" height="38" rx="2"/>
      <line x1="350" y1="185" x2="350" y2="255"/><rect x="342" y="200" width="16" height="42" rx="2"/>
      <line x1="560" y1="130" x2="560" y2="205"/><rect x="552" y="148" width="16" height="42" rx="2"/>
    </g>
    <g stroke="#45A29E" fill="#0B0F17">
      <line x1="250" y1="240" x2="250" y2="315"/><rect x="242" y="258" width="16" height="40" rx="2"/>
      <line x1="460" y1="200" x2="460" y2="270"/><rect x="452" y="218" width="16" height="38" rx="2"/>
    </g>
  </g>
  <!-- coin -->
  <g transform="translate(650,300)">
    <circle r="42" fill="#0B0F17" stroke="url(#coin)" stroke-width="4"/>
    <circle r="42" fill="#66FCF1" opacity="0.08"/>
    <text x="0" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#66FCF1">$</text>
  </g>
</svg>

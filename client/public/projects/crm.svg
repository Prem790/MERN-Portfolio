<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#111826"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#45A29E"/>
      <stop offset="1" stop-color="#66FCF1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="650" cy="90" r="150" fill="#66FCF1" opacity="0.10"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <line x1="80" y1="90" x2="80" y2="330"/>
    <line x1="80" y1="330" x2="720" y2="330"/>
    <line x1="80" y1="270" x2="720" y2="270"/>
    <line x1="80" y1="210" x2="720" y2="210"/>
    <line x1="80" y1="150" x2="720" y2="150"/>
  </g>
  <!-- KPI cards -->
  <g>
    <rect x="80" y="50" width="150" height="26" rx="6" fill="#ffffff" opacity="0.06"/>
    <rect x="250" y="50" width="110" height="26" rx="6" fill="#ffffff" opacity="0.06"/>
    <rect x="80" y="50" width="60" height="26" rx="6" fill="#66FCF1" opacity="0.5"/>
  </g>
  <!-- bars -->
  <g>
    <rect x="130" y="250" width="46" height="80" rx="6" fill="url(#bar)" opacity="0.85"/>
    <rect x="240" y="200" width="46" height="130" rx="6" fill="url(#bar)" opacity="0.85"/>
    <rect x="350" y="230" width="46" height="100" rx="6" fill="url(#bar)" opacity="0.85"/>
    <rect x="460" y="160" width="46" height="170" rx="6" fill="url(#bar)" opacity="0.9"/>
    <rect x="570" y="120" width="46" height="210" rx="6" fill="url(#bar)"/>
  </g>
  <!-- trend line -->
  <polyline points="153,240 263,190 373,215 483,150 593,110" fill="none" stroke="#66FCF1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0B0F17" stroke="#66FCF1" stroke-width="3">
    <circle cx="153" cy="240" r="5"/><circle cx="263" cy="190" r="5"/><circle cx="373" cy="215" r="5"/><circle cx="483" cy="150" r="5"/><circle cx="593" cy="110" r="5"/>
  </g>
</svg>
